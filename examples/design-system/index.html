<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uidx example design system</title>
    <link rel="stylesheet" href="/generated/html/tokens.css" />
    <link rel="stylesheet" href="/generated/html/checkbox.css" />
    <link rel="stylesheet" href="/generated/html/field.css" />
    <link rel="stylesheet" href="/generated/html/checkbox-field.css" />
    <link rel="stylesheet" href="/generated/html/button.css" />
    <link rel="stylesheet" href="/generated/html/contact-option.css" />
    <link rel="stylesheet" href="/generated/html/contact-list.css" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; color: rgb(24 24 27); }
      main { display: grid; gap: 40px; max-width: 720px; }
      section h2 { font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: rgb(113 113 122); margin: 0 0 12px; }
      .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      .split { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
      .split > div > h3 { font-size: 12px; color: rgb(113 113 122); margin: 0 0 8px; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <p>
        Every component below is a render of a <code>.uidx</code> identity in <code>.uidx/</code>:
        behaviour from the headless <code>hwc-*</code> elements, appearance from the generated
        stylesheets, and the React column from the generated components.
      </p>
      <div class="split">
        <div>
          <h3>HTML target — generated markup and CSS</h3>
          <div id="html-target"></div>
        </div>
        <div>
          <h3>React target — generated components</h3>
          <div id="react-target"></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
