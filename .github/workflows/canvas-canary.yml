name: Canvas Canary

# Pure and reusable: this workflow only runs the canary and needs no
# permissions beyond checking out the repo. Nightly scheduling and
# failure-alerting (which needs issues: write) live in
# nightly-canvas-canary.yml instead — GitHub statically validates that a
# caller grants every permission a reusable workflow's jobs declare, even
# for a job gated behind an `if:` that would never run in that context. A
# caller here (dependency-gate.yml, release.yml) would otherwise be forced
# to grant issues: write it has no other use for, just to satisfy that
# check.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build:cli

      - name: Pack npm release
        run: node scripts/pack-release.mjs

      # playwright is in neverBuiltDependencies (see package.json) so a plain
      # `pnpm install` never downloads a browser; only this job does.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Canvas canary
        run: pnpm test:canvas

      # Uploaded whether the canary passed or failed, so a human can look at
      # what it actually saw instead of trusting a byte-count heuristic blind.
      - name: Upload canvas screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvas-canary-screenshot
          path: canvas-canary.png
          if-no-files-found: warn
          retention-days: 14
